name: Windows Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package-windows:
    name: Package Windows desktop
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare local properties
        shell: pwsh
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LOCAL_PROPERTIES_BASE64)) {
            throw "Missing required GitHub Actions secret: LOCAL_PROPERTIES_BASE64. Add it in Repository Settings > Secrets and variables > Actions."
          }

          [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($env:LOCAL_PROPERTIES_BASE64)) |
            Set-Content -Encoding UTF8 -NoNewline -LiteralPath "local.properties"

          $localProperties = Get-Content -LiteralPath "local.properties" -Raw
          foreach ($name in @("SUPABASE_URL", "SUPABASE_ANON_KEY")) {
            if ($localProperties -notmatch "(?m)^\s*$name\s*=\s*\S+") {
              throw "LOCAL_PROPERTIES_BASE64 is missing required key: $name"
            }
          }

      - name: Validate desktop tests
        run: .\gradlew.bat :composeApp:desktopTest --no-daemon --stacktrace --no-configuration-cache

      - name: Package installers
        run: .\gradlew.bat :composeApp:packageMsi :composeApp:packageExe --no-daemon --stacktrace --no-configuration-cache

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $artifactRoot = "composeApp\build\compose\binaries\main"
          $releaseRoot = "release-assets"
          New-Item -ItemType Directory -Force -Path $releaseRoot | Out-Null

          $tagName = "${{ github.ref_name }}"
          $version = $tagName.TrimStart("v")

          $msi = Get-ChildItem $artifactRoot -Recurse -Filter *.msi | Select-Object -First 1
          if ($null -ne $msi) {
            Copy-Item -LiteralPath $msi.FullName -Destination (Join-Path $releaseRoot "Nuvio-Windows-$version.msi") -Force
          }

          $exe = Get-ChildItem $artifactRoot -Recurse -Filter *.exe | Select-Object -First 1
          if ($null -ne $exe) {
            Copy-Item -LiteralPath $exe.FullName -Destination (Join-Path $releaseRoot "Nuvio-Setup-$version.exe") -Force
          }

          $files = Get-ChildItem (Join-Path $releaseRoot "*") -File -Include *.msi,*.exe
          foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName
            "$($hash.Hash.ToLowerInvariant())  $($file.Name)" | Set-Content -Encoding ASCII -LiteralPath "$($file.FullName).sha256"
          }

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-windows-installers
          path: |
            release-assets/*.msi
            release-assets/*.exe
            release-assets/*.sha256

      - name: Publish draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          target_commitish: main
          files: |
            release-assets/*.msi
            release-assets/*.exe
            release-assets/*.sha256
