# Minimal build configuration for Nuvio Windows.
#
# Public release builds should only include the shared backend configuration
# required for sign-in and sync. Do not put personal account tokens here.
SUPABASE_URL=your_supabase_url_here
SUPABASE_ANON_KEY=your_supabase_anon_key_here

# Optional for private self-builds only.
# Normal installed-app users configure Trakt inside Settings -> Account -> Trakt.
# Do not publish installers built with personal Trakt credentials.
# TRAKT_REDIRECT_URI=nuvio://auth/trakt
# TRAKT_CLIENT_ID=your_trakt_client_id
# TRAKT_CLIENT_SECRET=your_trakt_client_secret
